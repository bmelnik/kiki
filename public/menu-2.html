<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KIKI | תפריט-2</title>
    <style>
      :root { color: #0d3b52; font-family: Georgia, "Times New Roman", serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f8f6f2; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 5vw; background: #0d3b52; }
      header img { width: 120px; height: auto; }
      header a { color: white; font-family: Arial, sans-serif; font-size: 14px; }
      main { width: min(1120px, 90vw); margin: 0 auto; padding: 42px 0 64px; }
      .intro { text-align: center; margin-bottom: 28px; }
      .intro p { margin: 0 0 8px; color: #7e6444; font: 13px Arial, sans-serif; letter-spacing: .2em; }
      h1, h2 { margin: 0; }
      h1 { font-size: clamp(34px, 5vw, 52px); }
      .intro h2 { margin-top: 10px; color: #666; font: 14px Arial, sans-serif; }
      .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
      button { min-height: 54px; border: 1px solid #d8d0c4; background: white; color: #0d3b52; font: 17px Arial, sans-serif; cursor: pointer; }
      button.active { border-color: #0d3b52; background: #0d3b52; color: white; }
      .viewer { overflow: hidden; border: 1px solid #d8d0c4; background: white; }
      .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid #e8e1d8; }
      .viewer-head h2 { color: #7e6444; font-size: 26px; }
      .viewer-head a { color: #0d3b52; font: 14px Arial, sans-serif; }
      iframe { display: block; width: 100%; height: 78vh; min-height: 560px; border: 0; background: white; }
      @media (max-width: 640px) { header { padding-inline: 20px; } main { width: 92vw; padding-top: 30px; } .tabs { grid-template-columns: repeat(2, 1fr); } .viewer-head { align-items: flex-start; flex-direction: column; } iframe { min-height: 70vh; } }
    </style>
  </head>
  <body>
    <header>
      <a href="/"><img src="/kiki-logo.svg" alt="Kiki" /></a>
      <a href="/">חזרה לתפריט הראשי</a>
    </header>
    <main>
      <section class="intro">
        <p>KIKI</p>
        <h1>תפריט-2</h1>
        <h2>בחרו תפריט לצפייה</h2>
      </section>
      <nav class="tabs" aria-label="סוגי תפריט">
        <button class="active" data-file="/menu-food.pdf">אוכל</button>
        <button data-file="/menu-alcohol.pdf">אלכוהול</button>
        <button data-file="/menu-wine.pdf">יין</button>
        <button data-file="/menu-cocktails.pdf">קוקטיילים</button>
      </nav>
      <section class="viewer">
        <div class="viewer-head">
          <h2 id="menu-title">תפריט אוכל</h2>
          <a id="open-link" href="/menu-food.pdf" target="_blank" rel="noreferrer">פתיחה בחלון חדש</a>
        </div>
        <iframe id="menu-frame" title="תפריט אוכל" src="/menu-food.pdf#view=FitH"></iframe>
      </section>
    </main>
    <script>
      const labels = { "/menu-food.pdf": "אוכל", "/menu-alcohol.pdf": "אלכוהול", "/menu-wine.pdf": "יין", "/menu-cocktails.pdf": "קוקטיילים" };
      const frame = document.getElementById("menu-frame");
      const title = document.getElementById("menu-title");
      const link = document.getElementById("open-link");
      document.querySelectorAll("button[data-file]").forEach((button) => button.addEventListener("click", () => {
        const file = button.dataset.file;
        document.querySelectorAll("button[data-file]").forEach((item) => item.classList.toggle("active", item === button));
        frame.src = file + "#view=FitH";
        frame.title = "תפריט " + labels[file];
        title.textContent = "תפריט " + labels[file];
        link.href = file;
      }));
    </script>
  </body>
</html>
